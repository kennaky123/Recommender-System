<!doctype html>
<html lang="vi">
  <head>
    <meta charset="UTF-8" />
    <title>Study Plan Recommendation</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <div class="container">
      <h1>Study Plan Recommendation</h1>

      <div class="form-group">
        <label>Mục tiêu học</label>
        <select id="goal">
          <option value="frontend">Frontend</option>
          <option value="backend">Backend</option>
          <option value="database">Database</option>
          <option value="project">Làm dự án</option>
        </select>
      </div>

      <div class="form-group">
        <label>Trình độ hiện tại</label>
        <select id="level">
          <option value="1">Level 1 - Mới bắt đầu</option>
          <option value="2">Level 2 - Cơ bản</option>
          <option value="3">Level 3 - Trung bình</option>
          <option value="4">Level 4 - Khá</option>
        </select>
      </div>

      <div class="form-group">
        <label>Số giờ học mỗi ngày</label>
        <input type="number" id="hoursPerDay" value="2" min="1" max="10" />
      </div>

      <div class="form-group">
        <label>Kỹ năng đã biết</label>
        <input
          type="text"
          id="knownSkills"
          placeholder="Ví dụ: html, css, sql"
        />
      </div>

      <div class="form-group">
        <label>Kỹ năng còn yếu</label>
        <input
          type="text"
          id="weakSkills"
          placeholder="Ví dụ: javascript, react"
        />
      </div>

      <button onclick="handleRecommend()">Gợi ý lộ trình học</button>

      <div id="result" class="result"></div>
    </div>

    <script src="script.js"></script>
  </body>
</html>
